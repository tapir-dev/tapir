[package]
name = "tapir"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Minimal but extensible coding agent"

[dependencies]
color-eyre = "0.6.5"

# THROWAWAY: dev-deps below exist only for the wayfinder prototype
# `examples/proto_tool_trait.rs` (tapir-dev/tapir#5). Not part of the design;
# discard with the branch.
[dev-dependencies]
async-trait = "0.1"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "proto_tool_trait"
path = "examples/proto_tool_trait.rs"
